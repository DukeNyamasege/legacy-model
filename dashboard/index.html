  <script>
    /*
     * Deriv may return an OAuth authorization response to the site root when an
     * older registered redirect is still in circulation. Never leave code/state
     * in the visible address bar or browser history while the static dashboard
     * boots. Copy only the callback fields into memory, clean the current history
     * entry immediately, and hand the response to the same-origin /oauth proxy.
     * The backend performs the PKCE/state checks, creates the HttpOnly session,
     * and already responds with a 303 redirect to the clean root.
     */
    (function () {
      var current;
      try {
        current = new URL(window.location.href);
      } catch (_) {
        return;
      }

      var isRootCallback = current.pathname === "/" && (
        current.searchParams.has("code") || current.searchParams.has("error")
      );
      if (!isRootCallback) return;

      var callback = new URL("/oauth/callback", current.origin);
      ["code", "state", "error", "error_description"].forEach(function (key) {
        var value = current.searchParams.get(key);
        if (value) callback.searchParams.set(key, value);
      });

      document.documentElement.dataset.oauthCallbackProcessing = "true";
      window.__FOA_OAUTH_CALLBACK_PENDING__ = true;

      /* Replace, rather than push, so the sensitive callback URL is not kept in
         the user's Back-button history. */
      try {
        window.history.replaceState(window.history.state, "", "/");
      } catch (_) {}

      window.fetch(callback.pathname + callback.search, {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        redirect: "follow",
        referrerPolicy: "no-referrer",
        headers: { "Accept": "text/html,application/xhtml+xml" }
      }).then(function (response) {
        var finalUrl;
        try {
          finalUrl = new URL(response.url, current.origin);
        } catch (_) {
          finalUrl = null;
        }
        var oauthError = finalUrl && finalUrl.searchParams.get("oauth_error");
        if (oauthError) {
          try {
            window.sessionStorage.setItem("foa-oauth-error-v1", String(oauthError).slice(0, 700));
          } catch (_) {}
          window.location.replace("/");
          return;
        }
        if (!response.ok) throw new Error("OAuth callback request failed");
        window.location.replace("/");
      }).catch(function () {
        /* Network/proxy fallback: use the normal backend callback navigation.
           location.replace prevents this temporary URL becoming a history entry,
           and the backend immediately redirects back to '/'. */
        window.location.replace(callback.pathname + callback.search);
      });
    })();
  </script>

  <script>
    // A connected private WebSocket is transport readiness, not a separate
    // strategy state. Keep the Custom Strategy status line on the scanner state
    // instead of visibly oscillating between Waiting and transport-active.
    (function () {
      var waiting = "Waiting - Execution session ready; waiting for the configured Custom Strategy condition";
      var scheduled = false;
      function normalizeRuntimeCopy() {
        scheduled = false;
        document.querySelectorAll(".builder-status-line span").forEach(function (node) {
          if (String(node.textContent || "").toLowerCase().indexOf("private trading connection is active") !== -1) {
            node.textContent = waiting;
          }
        });
        document.querySelectorAll(".trades-control-panel p").forEach(function (node) {
          if (String(node.textContent || "").toLowerCase().indexOf("private trading connection is active") !== -1) {
            node.textContent = "Execution session ready; waiting for the configured Custom Strategy condition.";
          }
        });
      }
      function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(normalizeRuntimeCopy);
      }
      new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      window.setInterval(schedule, 500);
      document.readyState === "loading"
        ? document.addEventListener("DOMContentLoaded", schedule, { once: true })
        : schedule();
    })();

    window.setTimeout(function () {
      var bootstrap = document.getElementById("foa-bootstrap");
      var app = document.getElementById("foa-simple-app");
      if (bootstrap && app) bootstrap.remove();
      if (bootstrap && !app) {
        bootstrap.innerHTML = "<div><strong>Dashboard could not start</strong><span>Refresh the page once. If the issue continues, check the browser console.</span></div>";
      }
    }, 8000);
  </script>
