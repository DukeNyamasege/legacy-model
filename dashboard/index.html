  <link rel="stylesheet" href="./trades-page-minimal.css">
  <link rel="stylesheet" href="./final-dashboard-authority.css">
  <link rel="stylesheet" href="./trades-start-stop-toggle.css">

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #03070d;
      color: #f8fafc;
      font-family: "Space Grotesk", "Manrope", "Segoe UI", sans-serif;
    }

    #foa-bootstrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 0%, rgba(59, 130, 246, .16), transparent 34rem),
        linear-gradient(135deg, #010409, #07111d 50%, #030712);
    }

    #foa-bootstrap > div {
      text-align: center;
      padding: 24px;
    }

    #foa-bootstrap i {
      display: block;
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid rgba(148, 163, 184, .22);
      border-top-color: #3b82f6;
      border-radius: 999px;
      animation: foa-spin .8s linear infinite;
    }

    #foa-bootstrap strong,
    #foa-bootstrap span {
      display: block;
    }

    #foa-bootstrap span {
      margin-top: 8px;
      color: #a5b4c6;
      font-size: 14px;
    }

    @keyframes foa-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="foa-bootstrap">
    <div>
      <i aria-hidden="true"></i>
      <strong>Trading Dashboard</strong>
      <span>Opening dashboard...</span>
    </div>
  </div>
  <noscript>This dashboard requires JavaScript.</noscript>
  <script src="/ui/dashboard-v2.js" defer></script>
  <script src="/ui/dashboard-actions-v2.js" defer></script>
  <script src="./mobile-menu-exit-spot.js" defer></script>
  <script src="./mobile-topbar-compact.js" defer></script>
  <script src="./tablet-navigation-fix.js" defer></script>
  <script src="./global-trade-clear.js" defer></script>
  <script src="./trades-page-minimal.js" defer></script>
  <script src="./final-dashboard-authority.js" defer></script>
  <script src="./trades-start-stop-toggle.js" defer></script>
  <script src="./last-digit-special-ui.js" defer></script>
  <script src="./matches-differs-last-digit.js?v=20260813-5" defer></script>
  <script src="./risk-stop-session-authority.js" defer></script>
  <script src="./signed-risk-limit-display.js" defer></script>
  <script src="./account-bound-risk-notice.js" defer></script>
  <script src="./result-based-strategy.js" defer></script>
  <script src="./result-ui-fixes.js" defer></script>
  <script src="./stopped-ui-authority.js?v=20260813-2" defer></script>
  <script src="./strategy-edit-authority.js?v=20260813-2" defer></script>
  <script>
    // A connected private WebSocket is transport readiness, not a separate
    // strategy state. Keep the Custom Strategy status line on the scanner state
    // instead of visibly oscillating between Waiting and transport-active.
    (function () {
      var waiting = "Waiting - Execution session ready; waiting for the configured Custom Strategy condition";
      var scheduled = false;
      function normalizeRuntimeCopy() {
        scheduled = false;
        document.querySelectorAll(".builder-status-line span").forEach(function (node) {
          if (String(node.textContent || "").toLowerCase().indexOf("private trading connection is active") !== -1) {
            node.textContent = waiting;
          }
        });
        document.querySelectorAll(".trades-control-panel p").forEach(function (node) {
          if (String(node.textContent || "").toLowerCase().indexOf("private trading connection is active") !== -1) {
            node.textContent = "Execution session ready; waiting for the configured Custom Strategy condition.";
          }
        });
      }
      function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(normalizeRuntimeCopy);
      }
      new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      window.setInterval(schedule, 500);
      document.readyState === "loading"
        ? document.addEventListener("DOMContentLoaded", schedule, { once: true })
        : schedule();
    })();

    window.setTimeout(function () {
      var bootstrap = document.getElementById("foa-bootstrap");
      var app = document.getElementById("foa-simple-app");
      if (bootstrap && app) bootstrap.remove();
      if (bootstrap && !app) {
        bootstrap.innerHTML = "<div><strong>Dashboard could not start</strong><span>Refresh the page once. If the issue continues, check the browser console.</span></div>";
      }
    }, 8000);
  </script>
</body>
</html>
