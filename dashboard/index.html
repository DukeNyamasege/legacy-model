  <title>DerivAdmin · Home of Automation</title>
  <script>
    (function () {
      var current;
      try { current = new URL(window.location.href); } catch (_) { return; }
      var isRootCallback = current.pathname === "/" && (
        current.searchParams.has("code") || current.searchParams.has("error")
      );
      if (!isRootCallback) return;

      var callback = new URL("/oauth/callback", current.origin);
      ["code", "state", "error", "error_description"].forEach(function (key) {
        var value = current.searchParams.get(key);
        if (value) callback.searchParams.set(key, value);
      });

      document.documentElement.dataset.oauthCallbackProcessing = "true";
      window.__FOA_OAUTH_CALLBACK_PENDING__ = true;
      try { window.history.replaceState(window.history.state, "", "/"); } catch (_) {}

      window.fetch(callback.pathname + callback.search, {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        redirect: "follow",
        referrerPolicy: "no-referrer",
        headers: { "Accept": "text/html,application/xhtml+xml" }
      }).then(function (response) {
        var finalUrl;
        try { finalUrl = new URL(response.url, current.origin); } catch (_) { finalUrl = null; }
        var oauthError = finalUrl && finalUrl.searchParams.get("oauth_error");
        if (oauthError) {
          try { window.sessionStorage.setItem("foa-oauth-error-v1", String(oauthError).slice(0, 700)); } catch (_) {}
          window.location.replace("/");
          return;
        }
        if (!response.ok) throw new Error("OAuth callback request failed");
        window.location.replace("/");
      }).catch(function () {
        window.location.replace(callback.pathname + callback.search);
      });
    })();
  </script>
