name: Guardian Safety Checks

on:
  push:
    branches: [main]
    paths:
      - "guardian/**"
      - "scripts/install_guardian.sh"
      - "scripts/guardian_discover_telegram_chat.py"
      - ".env.guardian.example"
      - "deploy/legacy-model-guardian.service"
      - ".github/workflows/guardian.yml"
  pull_request:
    paths:
      - "guardian/**"
      - "scripts/install_guardian.sh"
      - "scripts/guardian_discover_telegram_chat.py"
      - ".env.guardian.example"
      - "deploy/legacy-model-guardian.service"
      - ".github/workflows/guardian.yml"

permissions:
  contents: read

jobs:
  guardian-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: guardian/requirements.txt
      - name: Install Guardian dependencies
        run: python -m pip install -r guardian/requirements.txt
      - name: Compile Guardian
        run: python -m compileall -q guardian scripts/guardian_discover_telegram_chat.py
      - name: Run Guardian tests
        run: python -m unittest -q guardian.tests.test_guardian
      - name: Validate installer shell
        run: sh -n scripts/install_guardian.sh
