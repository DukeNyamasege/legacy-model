name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      CONTROL_API_KEY: ci-control-api-key
      DASHBOARD_STREAM_SIGNING_KEY: ci-dashboard-stream-signing-key-123456789
      DERIV_TOKEN_ENCRYPTION_KEY: ""
      DERIV_TRADING_ENABLED: "false"
      TRADING_MODE: demo
      ALLOW_REAL_TRADING: "false"
      TELEGRAM_ALERTS_ENABLED: false
      TELEGRAM_NOTIFICATIONS_SUSPENDED: "true"
      VPS_TELEGRAM_NOTIFICATIONS_SUSPENDED: "true"
      PUBLIC_TESTING_FREE_ACCESS: "false"
      PREMIUM_ACCESS_ENFORCEMENT: "true"
      LIPANA_ENVIRONMENT: sandbox
      LIPANA_SECRET_KEY: ""
      LIPANA_WEBHOOK_SECRET: ""
      FRONTEND_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,https://derivadmin.site"
      DASHBOARD_FRONTEND_ORIGINS: "https://derivadmin.site,https://www.derivadmin.site"
      ALLOW_LEGACY_GLOBAL_TOKENS: "true"
      COPYTRADING_ALLOW_LEGACY_GLOBAL_TOKENS: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy
          npm install --ignore-scripts --no-audit --no-fund
          umask 077
          : > .env

      - name: Validate VPS deployment and Compose
        run: |
          sh -n \
            scripts/deploy_full_vps.sh \
            scripts/prepare_full_vps_host.sh \
            scripts/enable_full_vps_https.sh \
            scripts/install_full_vps_caddy.sh \
            scripts/run_legacy_release_tests.sh \
            scripts/cleanup_repository_state.sh \
            scripts/diagnose_vps_performance.sh
          docker compose -f docker-compose.yml config --quiet
          PUBLIC_ORIGIN=https://release-gate.example PUBLIC_TESTING_FREE_ACCESS=true \
            docker compose -f docker-compose.yml -f docker-compose.vps.yml config --quiet
          alembic heads | grep -q "20260819_0026 (head)"

      - name: Compile Python
        run: python -m compileall -q app scripts tests migrations

      - name: Lint final VPS execution authorities
        run: |
          ruff check --output-format=github --select E9,F63,F7,F82 \
            app/vps_core_api.py \
            app/vps_api_surface.py \
            app/vps_realtime_gateway.py \
            app/vps_backend_api.py \
            app/tp_sl_manual_only_authority.py \
            app/direct_execution_worker_fence.py \
            app/global_recovery_execution_policy.py \
            app/never_auto_stop_repository_authority.py \
            app/stale_split_basis_reconciliation_authority.py \
            app/vps_provider_connection_resilience_v2.py \
            app/custom_strategy_worker.py \
            tests/test_full_vps_hosting.py \
            tests/test_tp_sl_manual_only_authority.py \
            tests/test_vps_purchase_continuity_v2.py

      - name: Typecheck VPS bootstrap and lifecycle authority
        run: |
          mypy --follow-imports=skip --ignore-missing-imports --allow-untyped-defs \
            --disable-error-code=misc --disable-error-code=arg-type \
            app/vps_core_api.py \
            app/vps_api_surface.py \
            app/vps_realtime_gateway.py \
            app/vps_backend_api.py \
            app/tp_sl_manual_only_authority.py

      - name: Check VPS frontend JavaScript syntax
        run: |
          node --check dashboard/final-premium-6f3.js
          node --check dashboard/final-ui-shell-v2.js
          node --check dashboard/public-testing-runtime-v1.js
          node --check dashboard/vps-api-boundary-v2.js
          node --check dashboard/vps-realtime-client-v2.js
          node --check scripts/export-deriv-quill-icons-v2.mjs
          node --check scripts/build-vps.mjs
          node --check scripts/finalize-execution-continuity-v1.mjs
          node --check scripts/finalize-global-recovery-v1.mjs
          node --check scripts/finalize-runtime-coherence-v1.mjs
          node --check scripts/prepare-runtime-safety-v2.mjs
          node --check scripts/finalize-runtime-safety-v2.mjs
          node --check scripts/finalize-runtime-safety-v2b.mjs
          node --check scripts/finalize-sticky-stake-v1.mjs

      - name: Run VPS architecture and lifecycle regressions
        run: |
          python -m unittest -q tests.test_full_vps_hosting
          python -m unittest -q tests.test_tp_sl_manual_only_authority
          python -m unittest -q tests.test_vps_purchase_continuity_v2
          python -m unittest -q tests.test_global_recovery_policy
          python -m unittest -q tests.test_execution_continuity_v10
          python -m unittest -q tests.test_execution_stop_reason_authority
          python -m unittest -q tests.test_provider_connection_resilience
          python -m unittest -q tests.test_websocket_hot_path_hardening
          python -m unittest -q tests.test_websocket_execution_hardening
          python -m unittest -q tests.test_runtime_execution_safety_v2
          python -m unittest -q tests.test_runtime_server_purchase_clock
          python -m unittest -q tests.test_sticky_stake_persistence

      - name: Run full release suite
        run: sh scripts/run_legacy_release_tests.sh

      - name: Build VPS frontend artifact
        env:
          PUBLIC_ORIGIN: https://release-gate.example
          PUBLIC_TESTING_FREE_ACCESS: "true"
        run: |
          npm run build:vps
          test -f dist/index.html
          test -f dist/vps-build.json
          test -f dist/final-premium-6f3.js
          test -f dist/final-ui-shell-v2.js
          test -f dist/vps-realtime-client-v2.js
          test ! -f dist/_redirects
          grep -Fq 'frontend-runtime" content="full-vps-final-ui-6f3"' dist/index.html
          grep -Fq '"deployment_topology": "direct-vps-only"' dist/vps-build.json
          grep -Fq '"api_base": "/api"' dist/vps-build.json
          grep -Fq '"oauth_base": "/oauth"' dist/vps-build.json
          grep -Fq '"legacy_ui_loaded": false' dist/vps-build.json
          grep -Fq '"legacy_ui_shipped": false' dist/vps-build.json

      - name: Build production images
        run: |
          docker build -f Dockerfile.frontend \
            --build-arg PUBLIC_ORIGIN=https://release-gate.example \
            --build-arg PUBLIC_TESTING_FREE_ACCESS=true \
            -t legacy-model-release-gate-frontend:${{ github.sha }} .
          docker build --target api -t legacy-model-release-gate-api:${{ github.sha }} .
          docker build --target worker -t legacy-model-release-gate-worker:${{ github.sha }} .
