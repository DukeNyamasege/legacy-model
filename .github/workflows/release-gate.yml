name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      CONTROL_API_KEY: ci-control-api-key
      DASHBOARD_STREAM_SIGNING_KEY: ci-dashboard-stream-signing-key-123456789
      DERIV_TOKEN_ENCRYPTION_KEY: ""
      DERIV_TRADING_ENABLED: "false"
      TRADING_MODE: demo
      ALLOW_REAL_TRADING: "false"
      TELEGRAM_ALERTS_ENABLED: "false"
      TELEGRAM_NOTIFICATIONS_SUSPENDED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Create CI-only Compose environment file
        run: |
          umask 077
          : > .env
          test -f .env

      - name: Validate Contabo deployment, Compose and migrations
        run: |
          sh -n scripts/deploy_dedicated_backend.sh \
            scripts/deploy_full_vps.sh \
            scripts/prepare_full_vps_host.sh \
            scripts/enable_full_vps_https.sh \
            scripts/run_legacy_release_tests.sh \
            scripts/cleanup_repository_state.sh \
            scripts/diagnose_vps_performance.sh
          docker compose -f docker-compose.yml config --quiet
          PUBLIC_ORIGIN=https://release-gate.example docker compose \
            -f docker-compose.yml -f docker-compose.vps.yml config --quiet
          python scripts/audit_bulk_execution_readiness.py --help >/dev/null
          alembic heads | grep -q "20260812_0021 (head)"

      - name: Compile Python
        run: python -m compileall -q app scripts tests migrations

      - name: Lint direct custom runtime
        run: >-
          ruff check --output-format=github --select E9,F63,F7,F82
          app/account_execution_session.py
          app/account_scoped_websocket_runtime.py
          app/backend_only_surface.py
          app/custom_split_recovery_authority.py
          app/custom_strategy_comparator_extension.py
          app/custom_strategy_current_runtime_fix.py
          app/custom_strategy_direct_runtime.py
          app/custom_strategy_instant_start.py
          app/custom_strategy_last_digit_prediction.py
          app/custom_strategy_last_digit_runtime.py
          app/custom_strategy_result_router.py
          app/custom_strategy_result_routing.py
          app/custom_strategy_result_routing_api.py
          app/custom_strategy_runtime_lifecycle.py
          app/custom_strategy_settlement.py
          app/custom_strategy_startup_authority.py
          app/custom_strategy_worker.py
          app/custom_strategy_runtime_api.py
          app/custom_virtual_contract_parity.py
          app/dashboard_live_events.py
          app/exact_strategy_execution_authority.py
          app/final_execution_continuity.py
          app/global_trade_history_cutoff.py
          app/netlify_backend_api.py
          app/netlify_realtime_gateway.py
          app/netlify_worker_bridge.py
          app/oauth_client.py
          app/oauth_direct_account_authority.py
          app/public_websocket_resilience.py
          app/real_demo_trading_support.py
          app/seamless_account_switch.py
          app/seamless_execution_recovery.py
          app/session_risk_api_authority.py
          app/session_risk_limits.py
          app/session_risk_stop_authority.py
          app/vps_backend_api.py
          app/vps_execution_start_recovery.py
          app/vps_realtime_events.py
          app/vps_seamless_worker.py
          tests/test_account_bound_risk_and_ws_continuity.py
          tests/test_custom_direct_runtime.py
          tests/test_custom_strategy_instant_start.py
          tests/test_current_custom_runtime_fix.py
          tests/test_dashboard_live_performance.py
          tests/test_exact_strategy_execution_authority.py
          tests/test_final_readiness_tp_tablet_last_digit.py
          tests/test_full_vps_hosting.py
          tests/test_global_trade_history_cutoff.py
          tests/test_netlify_vps_split.py
          tests/test_oauth_direct_mobile_compact.py
          tests/test_result_routing_and_recovery_spread.py
          tests/test_session_risk_and_multidevice_ui.py
          tests/test_strategy_template_runtime_upgrade.py
          tests/test_trades_start_stop_toggle.py
          tests/test_vps_seamless_experience.py

      - name: Typecheck direct custom runtime
        run: >-
          mypy --follow-imports=skip --ignore-missing-imports --allow-untyped-defs
          --disable-error-code=misc --disable-error-code=arg-type
          app/account_execution_session.py
          app/account_scoped_websocket_runtime.py
          app/backend_only_surface.py
          app/custom_split_recovery_authority.py
          app/custom_strategy_comparator_extension.py
          app/custom_strategy_current_runtime_fix.py
          app/custom_strategy_direct_runtime.py
          app/custom_strategy_instant_start.py
          app/custom_strategy_last_digit_prediction.py
          app/custom_strategy_last_digit_runtime.py
          app/custom_strategy_result_router.py
          app/custom_strategy_result_routing.py
          app/custom_strategy_result_routing_api.py
          app/custom_strategy_runtime_lifecycle.py
          app/custom_strategy_settlement.py
          app/custom_strategy_startup_authority.py
          app/custom_strategy_worker.py
          app/custom_strategy_runtime_api.py
          app/custom_virtual_contract_parity.py
          app/dashboard_live_events.py
          app/exact_strategy_execution_authority.py
          app/final_execution_continuity.py
          app/global_trade_history_cutoff.py
          app/netlify_backend_api.py
          app/netlify_realtime_gateway.py
          app/netlify_worker_bridge.py
          app/oauth_client.py
          app/oauth_direct_account_authority.py
          app/public_websocket_resilience.py
          app/real_demo_trading_support.py
          app/seamless_account_switch.py
          app/seamless_execution_recovery.py
          app/session_risk_api_authority.py
          app/session_risk_limits.py
          app/session_risk_stop_authority.py
          app/vps_backend_api.py
          app/vps_execution_start_recovery.py
          app/vps_realtime_events.py
          app/vps_seamless_worker.py

      - name: Check dashboard JavaScript syntax
        run: |
          node --check dashboard/dashboard-v2.js
          node --check dashboard/dashboard-actions-v2.js
          node --check dashboard/realtime-mode-hardening.js
          node --check dashboard/custom-martingale.js
          node --check dashboard/custom-runtime-client.js
          node --check dashboard/netlify-api-boundary.js
          node --check dashboard/netlify-realtime-client.js
          node --check dashboard/oauth-direct-runtime.js
          node --check dashboard/final-dashboard-authority.js
          node --check dashboard/trades-start-stop-toggle.js
          node --check dashboard/vps-seamless-experience.js
          node --check dashboard/last-digit-special-ui.js
          node --check dashboard/global-trade-clear.js
          node --check dashboard/matches-differs-last-digit.js
          node --check dashboard/signed-risk-limit-display.js
          node --check dashboard/tablet-navigation-fix.js
          node --check dashboard/account-bound-risk-notice.js
          node --check dashboard/result-based-strategy.js
          node --check dashboard/strategy-template-library.js
          node --check dashboard/runtime-ux-authority.js
          node --check dashboard/strategy-edit-authority.js
          node --check dashboard/platform-default-strategy.js
          node --check scripts/build-netlify.mjs
          node --check scripts/build-vps.mjs

      - name: Run focused release tests
        run: |
          python -m unittest -q tests.test_full_vps_hosting
          python -m unittest -q tests.test_vps_seamless_experience
          python -m unittest -q tests.test_account_bound_risk_and_ws_continuity
          python -m unittest -q tests.test_custom_direct_runtime
          python -m unittest -q tests.test_custom_strategy_instant_start
          python -m unittest -q tests.test_current_custom_runtime_fix
          python -m unittest -q tests.test_dashboard_live_performance
          python -m unittest -q tests.test_exact_strategy_execution_authority
          python -m unittest -q tests.test_final_readiness_tp_tablet_last_digit
          python -m unittest -q tests.test_global_trade_history_cutoff
          python -m unittest -q tests.test_netlify_vps_split
          python -m unittest -q tests.test_stop_history_and_mobile_ui
          python -m unittest -q tests.test_oauth_direct_mobile_compact
          python -m unittest -q tests.test_result_routing_and_recovery_spread
          python -m unittest -q tests.test_session_risk_and_multidevice_ui
          python -m unittest -q tests.test_strategy_template_runtime_upgrade
          python -m unittest -q tests.test_trades_start_stop_toggle
          python -m unittest -q tests.test_seamless_execution_final
          python -m unittest -q tests.test_bulk_credential_failure_hardening
          python -m unittest -q tests.test_credential_quarantine_runtime_guard
          python -m unittest -q tests.test_tick_sequence_persistence_safety
          python -m unittest -q tests.test_historical_unresolved_contract_quarantine
          python -m unittest -q tests.test_final_multi_strategy_execution
          python -m unittest -q tests.test_bulk_response_member_reconciliation
          python -m unittest -q tests.test_bulk_response_deep_member_fix
          python -m unittest -q tests.test_proposal_execution_recovery
          python -m unittest -q tests.test_manual_martingale_v2
          python -m unittest -q tests.test_custom_strategy_v1
          python -m unittest -q tests.test_custom_strategy_card_visibility_fix
          python -m unittest -q tests.test_multi_strategy tests.test_multi_strategy_concurrency tests.test_strategy_v2 tests.test_standardized_execution_runtime tests.test_per_account_virtual_runtime
          python -m unittest -q tests.test_websocket_execution_hardening
          python -m unittest -q tests.test_performance_hardening tests.test_generated_request_broker_js
          python -m unittest -q test_custom_martingale.py
          python -m unittest -q test_aidr_recovery_v2.py tests.test_aidr_virtual_soft_gate tests.test_independent_websocket_execution tests.test_private_websocket_credentials
          sh scripts/run_legacy_release_tests.sh

      - name: Legacy compiler compatibility build
        env:
          BACKEND_ORIGIN: https://api.release-gate.example
        run: |
          npm run build:netlify
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fq '/api/* https://api.release-gate.example/:splat 200' dist/_redirects
          grep -Fq '/oauth/* https://api.release-gate.example/oauth/:splat 200' dist/_redirects
          grep -Fq 'stream-base-url" content="wss://api.release-gate.example"' dist/index.html
          grep -Fq '/netlify-api-boundary.js' dist/index.html
          grep -Fq '/netlify-realtime-client.js' dist/index.html
          grep -Fq '/final-dashboard-authority.js' dist/index.html
          grep -Fq '/trades-start-stop-toggle.js' dist/index.html
          grep -Fq '/last-digit-special-ui.js' dist/index.html
          grep -Fq '/global-trade-clear.js' dist/index.html
          grep -Fq '/matches-differs-last-digit.js' dist/index.html
          grep -Fq '/signed-risk-limit-display.js' dist/index.html
          grep -Fq '/tablet-navigation-fix.js' dist/index.html
          grep -Fq '/account-bound-risk-notice.js' dist/index.html
          grep -Fq '/account-bound-risk-notice.css' dist/index.html
          grep -Fq '/result-based-strategy.js' dist/index.html
          grep -Fq '/result-based-strategy.css' dist/index.html
          grep -Fq '/strategy-template-library.js?v=20260814-2' dist/index.html
          grep -Fq '/runtime-ux-authority.js?v=20260814-3' dist/index.html
          test -f dist/global-trade-clear.js
          test -f dist/final-dashboard-authority.css
          test -f dist/trades-start-stop-toggle.css
          test -f dist/tablet-navigation-fix.css
          test -f dist/account-bound-risk-notice.js
          test -f dist/account-bound-risk-notice.css
          test -f dist/result-based-strategy.js
          test -f dist/result-based-strategy.css
          test -f dist/strategy-template-library.js
          test -f dist/strategy-template-library.css
          test -f dist/runtime-ux-authority.js
          test -f dist/runtime-ux-authority.css

      - name: Production full VPS frontend build
        env:
          PUBLIC_ORIGIN: https://release-gate.example
        run: |
          npm run build:vps
          test -f dist/index.html
          test -f dist/vps-build.json
          test ! -f dist/_redirects
          grep -Fq 'frontend-runtime" content="full-vps-same-origin-v2"' dist/index.html
          grep -Fq 'stream-base-url" content="wss://release-gate.example"' dist/index.html
          grep -Fq '/netlify-api-boundary.js?v=20260816-vps3' dist/index.html
          grep -Fq '/vps-seamless-experience.js?v=20260816-3' dist/index.html
          grep -Fq '/vps-seamless-experience.css?v=20260816-3' dist/index.html
          grep -Fq '"api_base": "/api"' dist/vps-build.json
          grep -Fq '"oauth_base": "/oauth"' dist/vps-build.json
          grep -Fq '"frontend_runtime": "full-vps-same-origin-v2"' dist/vps-build.json

      - name: Build frontend image
        run: >-
          docker build -f Dockerfile.frontend
          --build-arg PUBLIC_ORIGIN=https://release-gate.example
          -t legacy-model-release-gate-frontend:${{ github.sha }} .

      - name: Build API image
        run: docker build --target api -t legacy-model-release-gate-api:${{ github.sha }} .

      - name: Build worker image
        run: docker build --target worker -t legacy-model-release-gate-worker:${{ github.sha }} .
