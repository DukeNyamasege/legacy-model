name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      CONTROL_API_KEY: ci-control-api-key
      DERIV_TOKEN_ENCRYPTION_KEY: ""
      DERIV_TRADING_ENABLED: "false"
      TRADING_MODE: demo
      ALLOW_REAL_TRADING: "false"
      TELEGRAM_ALERTS_ENABLED: "false"
      TELEGRAM_NOTIFICATIONS_SUSPENDED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Create CI-only Compose environment file
        run: |
          umask 077
          : > .env
          test -f .env

      - name: Validate deployment shell, Compose and migrations
        run: |
          sh -n scripts/deploy_vps.sh scripts/update_vps.sh \
            scripts/run_legacy_release_tests.sh \
            scripts/cleanup_vps_artifacts.sh \
            scripts/diagnose_vps_performance.sh
          docker compose -f docker-compose.yml -f docker-compose.vps.yml config --quiet
          python scripts/audit_bulk_execution_readiness.py --help >/dev/null
          alembic heads | grep -q "20260805_0020 (head)"

      - name: Compile Python
        run: python -m compileall -q app scripts tests migrations

      - name: Check dashboard JavaScript syntax
        run: |
          node --check dashboard/dashboard-v2.js
          node --check dashboard/dashboard-actions-v2.js
          node --check dashboard/realtime-mode-hardening.js
          node --check dashboard/custom-martingale.js

      - name: Run focused release tests
        run: |
          python -m unittest -q tests.test_stop_history_and_mobile_ui
          python -m unittest -q tests.test_seamless_execution_final
          python -m unittest -q tests.test_bulk_credential_failure_hardening
          python -m unittest -q tests.test_tick_sequence_persistence_safety
          python -m unittest -q tests.test_historical_unresolved_contract_quarantine
          python -m unittest -q tests.test_final_multi_strategy_execution
          python -m unittest -q tests.test_bulk_response_member_reconciliation
          python -m unittest -q tests.test_proposal_execution_recovery
          python -m unittest -q tests.test_manual_martingale_v2
          python -m unittest -q tests.test_custom_strategy_v1
          python -m unittest -q tests.test_multi_strategy tests.test_multi_strategy_concurrency tests.test_strategy_v2 tests.test_standardized_execution_runtime tests.test_per_account_virtual_runtime
          python -m unittest -q tests.test_websocket_execution_hardening
          python -m unittest -q tests.test_performance_hardening tests.test_generated_request_broker_js
          python -m unittest -q test_custom_martingale.py
          python -m unittest -q test_aidr_recovery_v2.py tests.test_aidr_virtual_soft_gate tests.test_independent_websocket_execution tests.test_private_websocket_credentials
          sh scripts/run_legacy_release_tests.sh

      - name: Build API image
        run: docker build --target api -t legacy-model-release-gate-api:${{ github.sha }} .

      - name: Build worker image
        run: docker build --target worker -t legacy-model-release-gate-worker:${{ github.sha }} .
