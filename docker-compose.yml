x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-25m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >-
      postgres
      -c checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      -c checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      -c min_wal_size=${POSTGRES_MIN_WAL_SIZE:-512MB}
      -c wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
      -c idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      -c lock_timeout=${POSTGRES_LOCK_TIMEOUT:-5s}
      -c track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-underdog_test2}
      POSTGRES_USER: ${POSTGRES_USER:-underdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - test2_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-underdog} -d ${POSTGRES_DB:-underdog_test2}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    logging: *default-logging
    networks:
      test2: {}

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    command: >-
      sh -ec "python scripts/wait_for_database.py --timeout 180
      && alembic upgrade head
      && exec uvicorn app.netlify_backend_api:app --host 0.0.0.0 --port 8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-underdog}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-underdog_test2}
      DEPLOYMENT_ID: vps-backend-api
      CUSTOM_STRATEGY_ONLY_RUNTIME: "true"
      FRONTEND_HOSTING_MODE: ${FRONTEND_HOSTING_MODE:-netlify}
      DASHBOARD_FRONTEND_ORIGINS: ${DASHBOARD_FRONTEND_ORIGINS:-}
      DASHBOARD_STREAM_SIGNING_KEY: ${DASHBOARD_STREAM_SIGNING_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/database', timeout=3).read()"]
      interval: ${API_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${API_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${API_HEALTHCHECK_RETRIES:-30}
      start_period: ${API_HEALTHCHECK_START_PERIOD:-180s}
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    networks:
      test2: {}

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: >-
      sh -ec "python scripts/wait_for_database.py --timeout 180
      && exec python -m app.custom_strategy_worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-underdog}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-underdog_test2}
      DEPLOYMENT_ID: vps-custom-worker
      CUSTOM_STRATEGY_ONLY_RUNTIME: "true"
      FRONTEND_HOSTING_MODE: ${FRONTEND_HOSTING_MODE:-netlify}
      LIVE_TICK_LOG_LINES: ${LIVE_TICK_LOG_LINES:-false}

      # Shared REST pool is retained only for account discovery and authenticated
      # OTP/session setup. Custom financial purchases are direct account WebSocket
      # buys against the exact proposal ID.
      DERIV_HTTP_CONNECTOR_LIMIT: ${DERIV_HTTP_CONNECTOR_LIMIT:-8}
      DERIV_HTTP_LIMIT_PER_HOST: ${DERIV_HTTP_LIMIT_PER_HOST:-4}
      DERIV_HTTP_CONCURRENCY: ${DERIV_HTTP_CONCURRENCY:-4}
      DERIV_HTTP_TOTAL_TIMEOUT_SECONDS: ${DERIV_HTTP_TOTAL_TIMEOUT_SECONDS:-20}
      DERIV_HTTP_CONNECT_TIMEOUT_SECONDS: ${DERIV_HTTP_CONNECT_TIMEOUT_SECONDS:-8}
      DERIV_ACCOUNT_LIST_CACHE_SECONDS: ${DERIV_ACCOUNT_LIST_CACHE_SECONDS:-8}
      DERIV_HTTP_RETRY_BASE_SECONDS: ${DERIV_HTTP_RETRY_BASE_SECONDS:-0.35}

      # Private sessions exist only for enabled account runtimes. These settings
      # pace connection/OTP setup and reconnects; there are no cohorts or relays.
      PRIVATE_WS_CONNECT_INTERVAL_SECONDS: ${PRIVATE_WS_CONNECT_INTERVAL_SECONDS:-0.35}
      PRIVATE_WS_HANDSHAKE_CONCURRENCY: ${PRIVATE_WS_HANDSHAKE_CONCURRENCY:-2}
      PRIVATE_WS_RATE_LIMIT_BACKOFF_SECONDS: ${PRIVATE_WS_RATE_LIMIT_BACKOFF_SECONDS:-60}
      PRIVATE_WS_MAX_BACKOFF_SECONDS: ${PRIVATE_WS_MAX_BACKOFF_SECONDS:-300}
      PRIVATE_WS_RECONNECT_JITTER_SECONDS: ${PRIVATE_WS_RECONNECT_JITTER_SECONDS:-1.0}
      PRIVATE_WS_OTP_FAILURE_BACKOFF_SECONDS: ${PRIVATE_WS_OTP_FAILURE_BACKOFF_SECONDS:-5.0}

      # Planned Custom Strategy market-set restarts reconnect immediately; actual
      # provider outages/rate limits still use the bounded resilience backoff.
      DERIV_PUBLIC_WS_PLANNED_RESTART_SECONDS: ${DERIV_PUBLIC_WS_PLANNED_RESTART_SECONDS:-0.35}

      # Execution never waits for this UI wake-up. The worker sends a coalesced
      # best-effort notification and the API WebSocket also checks durable DB state.
      INTERNAL_DASHBOARD_REFRESH_URL: http://api:8080/control/internal/dashboard-settlement-refresh
    volumes:
      - test2_models:/app/model_artifacts
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      test2: {}

volumes:
  test2_database:
  test2_models:

networks:
  test2:
    internal: false
