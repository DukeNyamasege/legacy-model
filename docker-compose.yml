x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-25m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >-
      postgres
      -c checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      -c checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      -c min_wal_size=${POSTGRES_MIN_WAL_SIZE:-512MB}
      -c wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
      -c idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      -c lock_timeout=${POSTGRES_LOCK_TIMEOUT:-5s}
      -c track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-underdog_test2}
      POSTGRES_USER: ${POSTGRES_USER:-underdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - test2_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-underdog} -d ${POSTGRES_DB:-underdog_test2}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    logging: *default-logging
    networks:
      test2: {}

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    command: >-
      sh -ec "python scripts/wait_for_database.py --timeout 180
      && alembic upgrade head
      && exec uvicorn app.api_v3:app --host 0.0.0.0 --port 8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-underdog}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-underdog_test2}
      DEPLOYMENT_ID: vps-api
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/database', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    networks:
      test2: {}

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: >-
      sh -ec "python scripts/wait_for_database.py --timeout 180
      && exec python -m app.worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-underdog}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-underdog_test2}
      DEPLOYMENT_ID: vps-worker
      LIVE_TICK_LOG_LINES: ${LIVE_TICK_LOG_LINES:-false}
      TICK_PERSIST_BATCH_SIZE: ${TICK_PERSIST_BATCH_SIZE:-50}
      TICK_PERSIST_FLUSH_SECONDS: ${TICK_PERSIST_FLUSH_SECONDS:-1.0}
      INTERNAL_DASHBOARD_REFRESH_URL: http://api:8080/control/internal/dashboard-settlement-refresh
      DEPLOYMENT_RELEASE_ID: ${DEPLOYMENT_RELEASE_ID:-}
      DEPLOYMENT_RELEASE_FROM: ${DEPLOYMENT_RELEASE_FROM:-}
      DEPLOYMENT_RELEASE_CHANGE_COUNT: ${DEPLOYMENT_RELEASE_CHANGE_COUNT:-0}
      DEPLOYMENT_RELEASE_MESSAGE_B64: ${DEPLOYMENT_RELEASE_MESSAGE_B64:-}
    volumes:
      - test2_models:/app/model_artifacts
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      test2: {}

volumes:
  test2_database:
  test2_models:

networks:
  test2:
    internal: false
