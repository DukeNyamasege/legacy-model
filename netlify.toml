[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Production frontend architecture:
# - Netlify serves only static UI assets.
# - Set BACKEND_ORIGIN in Netlify environment variables after the dedicated VPS
#   backend has a stable HTTPS hostname. Do not commit the backend hostname here.
# - Optional DASHBOARD_WS_BASE_URL can override the WSS origin; otherwise the
#   build derives wss:// from BACKEND_ORIGIN.
# - scripts/build-netlify.mjs writes same-origin /api and /oauth proxy rewrites.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
